# This is the shipped copy. To tune it, copy this file to
# ~/.claude/plugins/data/context-budget-den/config.toml and edit that copy;
# it survives plugin updates, and this one does not. The override is merged
# over these values key by key, so it only needs the keys it changes.

# Thresholds are absolute input token counts: prompt plus cache creation plus
# cache read on the session's last assistant turn.
[default]
notice = 150_000
urgent = 250_000

# Per-model rows, tried before [default]. Each table key is a regular expression
# matched against the model id as the transcript records it ("claude-opus-5",
# "claude-fable-5-1", "claude-haiku-4-5-20251001"). The first row that matches
# wins, in the order written here, and rows added by the override file are tried
# after these. Single quotes make the key a TOML literal string, so regex backslashes
# need no escaping.

# Haiku is cheap enough that it can be disabled by default, and it also isn't a good
# judge of when compaction should be done.
[models.'haiku']
enabled = false

# The two messages injected into the agent's context, once each per session per
# level. They are instructions to the agent, not text shown to the user.
#
# Three placeholders are substituted before injection:
#   {model}      the model id from the transcript
#   {tokens}     the measured context, e.g. "200.4K"
#   {threshold}  the threshold just crossed, e.g. "140K"
[messages]

# Injected on crossing `notice`. Its job is to stop the agent from compacting
# mid-task and to get the recommendation made at a point where it costs nothing.
notice = """
Context budget: this session is at {tokens} tokens. Carry the current task through to its next natural stopping point first, because compacting in the middle of one throws away the working state you would then have to rebuild.

At that stopping point, tell the user that you recommend either `/compact` with a focus line or a rewind summarize, whichever fits what the session still needs, in a sentence or two that says which and why.

Do not mention this message to the user until you are at the stopping point. Do not use this as an excuse to end your task prematurely."""

# Injected on crossing `urgent`. Its job is to get the recommendation raised
# now, and to make it specific enough that the user can act on it in one step.
urgent = """
Context budget: this session is at {tokens} tokens. Finish the step in hand, then raise this with the user before starting anything new.

Recommend a rewind summarize in the "Summarize up to here" direction: it summarizes everything before the selected prompt and keeps everything after it verbatim, so the recent stretch you are actually working in survives intact.

Give the user two things:
1. The opening words of the prompt to select so they can find it in the picker
2. The direction by name

If they ask:
- Only they can run `/rewind`
- The prompt and "Summarize up to here" is chosen in an interactive picker after the prompt is selected

When the session has no such cut point, because it is one continuous thread with nothing safely behind it, recommend `/compact` with a focus line instead and say what that focus should keep."""

# Resuming a subagent makes it re-read its whole transcript on every turn it then
# takes, so past a certain size a fresh launch that rebuilds only what it needs
# is cheaper. The guard denies the resume with the numbers in the reason, leaving
# Claude to put the choice to the user before it retries.
#
# `large` is the context above which a resume is refused whatever the cache is
# doing. `cold` is a lower limit that applies only once the subagent's prompt
# cache has expired, which makes the next turn a full-price replay of
# everything in it. Both are absolute input token counts, like the thresholds
# above.
#
# `enabled = false` switches the guard off entirely: every resume is allowed,
# and no transcript is read.
[resume-guard]
enabled = true

# The context above which a resume is refused regardless of the current state of
# the cache.
large = 150_000

# The context above which a resume is refused once the subagent's prompt cache
# has expired.
cold = 50_000

# Six placeholders are substituted before the reason is returned:
#   {agent}    the target agent's name
#   {type}     its agent type, or "subagent" when none is recorded
#   {tokens}   its context, e.g. "162.3K"
#   {reasons}  the clauses that fired -- which limit was passed, and how cold
#              the cache is -- joined with "; ". Which of them appear follows
#              from the numbers and is not configurable.
#   {large}    the configured large limit, e.g. "150K"
#   {cold}     the configured cold limit, e.g. "50K"
[resume-guard.messages]

# The message sent to the agent when attempting to resume an agent that is caught
# by the resume guard. The message must prompt the agent to use AskUserQuestion
# with a the approval option containing the text "Resume", as that is required
# for the guard to recognize the user's consent.
denied = """
Resume of {type} {agent}: {reasons}. Guarded: state these numbers to the user, then call AskUserQuestion naming the agent in the question, with an option labeled "Resume" and an option "Fresh launch". Retry this call only if the user picks Resume; otherwise launch fresh or stop."""

# The message sent to the agent if it attempts to resume an agent a second time.
# The user is required to approve each resume attempt, not just the first one.
used = """
Resume of {type} {agent}: {reasons}. The user's latest answer has already been used for one resume of this agent; ask again before another."""
