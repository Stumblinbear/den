# An example, and the plugin's documentation of its own format. Neither hook
# reads this file. They read one file and only one:
#
#   ~/.claude/plugins/data/context-budget-den/config.toml
#
# Copy this file there to start from it. No file there means the context notice
# and the resume guard are both off, which is the state a fresh install is in.
#
# Nothing is merged under your copy, so every key below that has no default has
# to be in it. `enabled` defaults to true wherever it appears, a table of rows
# may be left out, and [watcher] may be left out with each of its keys
# defaulted. A key that is missing, or a value the hooks cannot use, is one line
# on stderr and all of them off for the session.
#
# What a cached token costs a model is not configuration: it is
# ../lib/pricing.toml.

# Thresholds are absolute input token counts: prompt plus cache creation plus
# cache read on the session's last assistant turn.
[default]
notice = 150_000
urgent = 250_000

# Per-model rows, tried before [default]. Each table key is a regular expression
# matched against the model id as the transcript records it ("claude-opus-5",
# "claude-fable-5-1", "claude-haiku-4-5-20251001"). The first row that matches
# wins, in the order written here. Single quotes make the key a TOML literal
# string, so regex backslashes need no escaping.

# Haiku is cheap enough to leave off, and it also isn't a good judge of when
# compaction should be done. A row switched off needs no thresholds.
[models.'haiku']
enabled = false

# Fable reads a cached context at a quarter of the usual price, while a
# compaction writes back what it keeps at twice a fresh input token on the
# one-hour lifetime. With the 45K or so a compaction writes back, as measured
# on real sessions, a compaction at 150K pays for itself only after about 35
# more turns; at 400K it takes about 11. That is why these two sit so much
# higher than [default]'s. The urgent level leaves 300K before the 1M window
# fills.
[models.'fable']
notice = 400_000
urgent = 700_000

# The two messages injected into the agent's context, once each per session per
# level. They are instructions to the agent, not text shown to the user.
#
# Three placeholders are substituted before injection:
#   {model}      the model id from the transcript
#   {tokens}     the measured context, e.g. "200.4K"
#   {threshold}  the threshold just crossed, e.g. "140K"
#
# Neither message names a cut point. That is the `context-budget:cut-point`
# skill's reading, taken when the agent is ready to put the choice to the user
# rather than baked in here and left to go stale.
[messages]

# Injected on crossing `notice`. Its job is to say the size once and then get
# out of the way until the arc the agent is in ends: a step inside an arc is
# not a point where a summarize is affordable, and an agent that treats it as
# one recommends a compaction at every brief and every launch.
notice = """
Context budget: this session is at {tokens} tokens. A summarize is worth it at the end of an arc, where the work ahead would not need the detail behind it; a step inside one, a brief written or an agent launched, is not that point, since a summary keeps what came before only in outline, and the next step still needs it exact. Until then, work as if this message had not arrived, since raising the budget early pulls the work toward stopping. When the arc ends, invoke the `context-budget:cut-point` skill and put the choice to the user in a sentence."""

# Injected on crossing `urgent`. Its job is to get the choice raised at the end
# of the step in hand rather than at the end of the arc, which is no longer
# affordable to wait for.
urgent = """
Context budget: this session is at {tokens} tokens, past the point where waiting for the arc to end is affordable. Finish the step in hand, then invoke the `context-budget:cut-point` skill and put the choice to the user before starting anything new."""

# The watcher. Past the `notice` threshold, at the end of every turn, it asks a
# small model whether the session has just reached a good moment to compact or
# rewind, and hands the answer to the agent on its next turn as advice. It never
# acts, and the agent may decline it.
#
# The model reads the same priced reading the `cut-point` skill prints, plus the
# recent conversation with the tool results left out. It paces itself: a "not
# yet" answer says how many turns to wait, and the wait is cut short by a
# commit, a push or a task marked completed. Past the `urgent` threshold it is
# never asked, since the urgent notice has already said what it would.
#
# Every key here has a default, and the whole table may be left out.
[watcher]

# `false` switches the watcher off: no Stop hook work beyond reading this file,
# and no model call. The rest of the plugin is unaffected.
enabled = true

# The model the judge runs on. Substituted into `command` wherever it writes
# {model}.
model = "haiku"

# The judge invocation, as an argument list rather than a shell line. A file
# without the key gets this one:
#
# command = [
#   "claude", "-p", "--model", "{model}", "--tools", "",
#   "--max-turns", "2", "--output-format", "json",
#   "--no-session-persistence",
#   "--json-schema", "<the two answer shapes, as a JSON Schema>",
# ]
#
# The schema is what makes the answer an object the CLI validated rather than
# prose to find a brace in; it comes back in the envelope's `structured_output`.
# `--tools ""` is what keeps the judge from acting: it is a Claude Code session
# of its own, and a sentence of advice is the whole of what it is asked for. The
# second turn is the platform's, for the tool call the structured output is
# taken through, which the model makes after the text it sometimes writes first.
#
# Write your own to run the judge on something else. It replaces the whole list,
# schema and all, so an answer from it is read out of the text: it is handed the
# prompt on stdin and read for one JSON object on stdout, either bare or in the
# `result` field of a `claude --output-format json` envelope. It runs in this
# directory, and CONTEXT_BUDGET_JUDGE=1 is set in it, which is what keeps this
# plugin's own hooks quiet inside a judge that is a Claude Code run of its own.

# How much conversation the judge is shown: this many recent turns, cut to this
# many tokens from the oldest end. A turn is one of your prompts and the replies
# to it, reduced to your words, the agent's words and the names of the tools it
# called.
tail_turns = 16
tail_tokens = 20_000

# Resuming a subagent makes it re-read its whole transcript on every turn it then
# takes, so past a certain size a fresh launch that rebuilds only what it needs
# is cheaper. The guard denies the resume with the numbers in the reason, leaving
# Claude to put the choice to the user before it retries.
#
# `large` is the context above which a resume is refused however warm the cache
# is: with the cache live a resume costs the resumed context times the model's
# cache-read multiple on every turn, so it stays the cheaper of the two while
# the context is under what a fresh launch would have to re-read. `large` is the
# room-to-finish line past that. `cold` is a lower limit that applies only once
# the subagent's prompt cache has expired, which adds one full-price rewrite of
# everything in it before the first turn. Both are absolute input token counts,
# like the thresholds above.
#
# `enabled = false` switches the guard off entirely, the rows below included:
# every resume is allowed, and no transcript is read. A file that wants the rows
# and nothing else raises these two numbers past anything a resume reaches.
[resume-guard]
enabled = true

# The two numbers every resume falls back to. At 300K a resumed implementer on
# Opus spends over the twenty turns a round runs to about what a fresh launch
# would, and it is held down from there because Opus 5 answers worse the more
# context it is carrying. 200K sits under the 230K a fresh implementer
# rediscovers on this project's sessions, which is what refusing a cold resume
# worth taking would cost.
large = 300_000
cold = 200_000

# Rows keyed by the resumed agent's type, tried before the model rows below and
# before the numbers above, because the type is the more specific fact about a
# resume. Keys are regular expressions matched against the type as its metadata
# records it, with the plugin prefix in place, so 'flag-reviewer' matches
# den:flag-reviewer. The first row that matches wins, in the order written here,
# and a row carries both limits or, switched off, neither.
#
# Only a type whose numbers would differ from what it gets anyway is worth a
# row: a flag reviewer takes the fable row below, and an implementer takes the
# numbers above, so neither is written out here.

# A fresh fixer rereads about 70K more than a resumed one, the least of the
# three agent kinds measured on this project, so a fixer is the first worth
# refusing. Over the nine rounds measured, a resume stops paying at about 120K
# warm and about 70K cold; the numbers below are rounded up from those, because
# refusing a resume worth taking costs the user a round trip and costs the fixer
# the red tests it is holding, and nine rounds is a thin sample to round the
# other way on. The key carries the plugin prefix so that no other plugin's
# agent of that name is caught by it; without den installed the row never
# matches and costs nothing.
[resume-guard.agents.'den:red-green-fixer']
large = 150_000
cold = 100_000

# Rows keyed by the model the subagent's newest turn was sent to, matched the
# same way as the [models] keys above and tried after the agent rows. A
# transcript whose newest turn names no model skips this table.

# Fable reads a cached context at a fortieth of a fresh input token, against a
# tenth on Opus, so a resume stays the cheaper of the two far past where it
# stops being so there. 600K leaves room to finish under the 700K urgent
# threshold above; 400K is about the 450K a fresh reviewer rereads, which is
# what refusing a cold resume would cost.
[resume-guard.models.'fable']
large = 600_000
cold = 400_000

# A Haiku resume is too cheap to be worth asking the user about. A row switched
# off needs no limits.
[resume-guard.models.'haiku']
enabled = false

# Seven placeholders are substituted before the reason is returned:
#   {agent}    the target agent's name
#   {type}     its agent type, or "subagent" when none is recorded
#   {model}    the model its newest turn names, or "no recorded model" where
#              it names none
#   {tokens}   its context, e.g. "162.3K"
#   {reasons}  the clauses that fired, naming which limit was passed and how
#              cold the cache is, joined with "; ". Which of them appear
#              follows from the numbers and is not configurable.
#   {large}    the large limit that governed this resume, e.g. "300K"
#   {cold}     the cold limit that governed it, e.g. "200K"
[resume-guard.messages]

# The message sent to the agent when it attempts a resume the guard catches. It
# must prompt the agent to use AskUserQuestion with an approval option
# containing the text "Resume", which is what the guard recognizes the user's
# consent by.
denied = """
Resume of {type} {agent}: {reasons}. Whether to resume at that price or launch fresh is the user's choice, since a resume keeps what this agent holds and a fresh launch loses it. Put the numbers to them with AskUserQuestion, naming the agent, with an option labeled "Resume" and an option "Fresh launch", and act on their answer: retry this call when they pick Resume."""

# The message sent to the agent if it attempts to resume an agent a second time.
# The user is required to approve each resume attempt, not just the first one.
used = """
Resume of {type} {agent}: {reasons}. The user's latest answer has already been used for one resume of this agent; ask again before another."""
