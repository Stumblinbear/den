name: Validate

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the toolchain
        run: npm ci
      - name: Format, lint and type check
        run: npm run check
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.259
      - name: Validate plugin manifests
        run: |
          for dir in plugins/*/; do
            claude plugin validate "${dir%/}"
          done
      - name: Validate marketplace manifest
        run: claude plugin validate .

  # 22.6 is the floor the hook launchers enforce, and the release Node is what
  # users mostly run; the tests themselves exercise both bun and Node on each.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22.6", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - name: Install the toolchain and every plugin's dependencies
        run: npm ci
      - name: Run the tests
        run: npm test
